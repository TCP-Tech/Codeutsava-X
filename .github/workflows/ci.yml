name: CI Check

on:
    push:
        branches:
            - dev
            - main
    pull_request:
        branches:
            - dev
            - main

jobs:
    check:
        name: Run Quality Checks
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 11.22.0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Run Quality Check
              # Lint, countdown tests, TypeScript, and production build.
              run: pnpm check
