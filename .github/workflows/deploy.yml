name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate and Build Release
        env:
          NEXT_PUBLIC_SITE_URL: https://codeutsava.nitrr.ac.in
        run: pnpm check

      - name: Copy Files to Server via rsync
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: ".next/standalone/,.next/static/,public/"
          target: "/var/www/codeutsava"
          strip_components: 0

      - name: Restart PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Copy static files into the standalone directory so the server can serve them
            cp -r /var/www/codeutsava/public /var/www/codeutsava/.next/standalone/
            cp -r /var/www/codeutsava/.next/static /var/www/codeutsava/.next/standalone/.next/

            # Restart or Start PM2 using the standalone server
            cd /var/www/codeutsava/.next/standalone
            pm2 start server.js --name codeutsava-web || pm2 restart codeutsava-web
            pm2 save
